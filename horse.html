<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horse House — Sugarlump</title>
<style>
:root{color-scheme:dark;--ink:#0d0d11;--cyan:#92f1eb;--cream:#f3f7f7;--panel:rgba(18,24,30,.86)}*{box-sizing:border-box}body{min-height:100svh;margin:0;padding:1.25rem;background:radial-gradient(circle at top,#1d3b40 0,#0d0d11 53%);color:var(--cream);font-family:Inter,system-ui,sans-serif;display:grid;place-items:center}.shell{width:min(100%,48rem);height:min(82svh,48rem);display:flex;flex-direction:column;border:1px solid var(--cyan);border-radius:1.25rem;overflow:hidden;background:var(--panel);box-shadow:0 1.5rem 5rem #0008}.masthead{padding:1.4rem 1.5rem 1rem;border-bottom:1px solid #92f1eb55}.masthead p{margin:0;color:var(--cyan);font-size:.7rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase}.masthead h1{margin:.3rem 0 0;font-size:clamp(2.3rem,8vw,4.5rem);line-height:.9;letter-spacing:-.075em;-webkit-text-stroke:1px #000;paint-order:stroke fill}.chat{flex:1;overflow:auto;padding:1.5rem;display:flex;flex-direction:column;gap:.8rem}.message{max-width:78%;padding:.85rem 1rem;border-radius:1rem;line-height:1.45}.ai{align-self:flex-start;background:#182a2d;border:1px solid #92f1eb66}.user{align-self:flex-end;background:var(--cyan);color:#0d0d11;font-weight:700}.composer{display:flex;gap:.7rem;padding:1rem;border-top:1px solid #92f1eb55}.composer input{min-width:0;flex:1;border:1px solid #92f1eb88;border-radius:.6rem;background:#090b0d;color:#fff;padding:.85rem;font:inherit}.composer button{border:0;border-radius:.6rem;background:var(--cyan);color:#0d0d11;padding:.85rem 1.1rem;font-weight:900;cursor:pointer}.composer :focus-visible{outline:3px solid #fff;outline-offset:2px}.site-footer{padding:.7rem 1rem;border-top:1px solid #92f1eb55;text-align:center;font-size:.8rem}.site-footer a{color:var(--cyan);text-decoration:none}.site-footer a:hover,.site-footer a:focus-visible{color:#fff;text-decoration:underline}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:600px){body{padding:.65rem}.shell{height:calc(100svh - 1.3rem)}}
</style>
</head>
<body><main class="shell"><header class="masthead"><p>Sugarlump presents</p><h1>HORSE HOUSE</h1></header><section class="chat" id="chat" role="log" aria-live="polite" aria-label="Horse House conversation"><div class="message ai">Welcome to HORSE HOUSE, which is just like having a HORSE in your HOUSE. Ask me anything.</div></section><form class="composer" id="form"><label class="sr" for="input">Message Horse House</label><input id="input" required autocomplete="off" placeholder="Ask the horse…"><button>Send</button></form><footer class="site-footer"><a href="index.html">← Back to Sugarlump</a></footer></main><script>const c=document.querySelector('#chat'),f=document.querySelector('#form'),i=document.querySelector('#input');function reply(t){return /how (many|much|old|far|tall|long|fast|heavy|high)|what year|what age|count|calculate|sum of|number of|\d\s*[+*/-]\s*\d/i.test(t)?Array(Math.floor(Math.random()*10)+1).fill('clop').join(' ').replace(/^./,'C')+'.':'Neigh.'}function add(w,t){let d=document.createElement('div');d.className='message '+w;d.textContent=t;c.append(d);c.scrollTop=c.scrollHeight}f.addEventListener('submit',e=>{e.preventDefault();let t=i.value.trim();if(!t)return;add('user',t);i.value='';setTimeout(()=>add('ai',reply(t)),300)})</script></body>
</html>
