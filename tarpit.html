  <script id="story-data" type="application/json">{"title":"This is not a Tarpit","start":"aba9b634-f651-4924-8bb2-8d813b8875e3","sections":[{"id":"aba9b634-f651-4924-8bb2-8d813b8875e3","text":"Doublecoo Stringfoot flew up to perch on the head of one of the lions at the base of Nelson's Column. As Trafalgar Square's leading pigeon secret agent, he was enjoying the ebb and flow of afternoon tourists. It was a pleasant change of pace from his last mission, which had involved taking out a German right-winger. Stringfoot was a master of the noble pigeon martial art of flung-poo, and he had caught his nazi target squarely in the eye. It had been captured by a photographer and liberally splashed around the papers. Stringfoot himself wasn't implicated of course. By the time the camera's shutter had clicked he was long gone, just another pigeon in the drab Berlin sky.\n\nNow was his time to relax, and he was considering helping himself to some discarded pastry flakes when an outbreak of cooing directed his attention towards the top of Nelson's Column. He was being summoned.\n\nThe top of Nelson's head was more chaotically populated than usual, and his arrival there precipitated a great shift in the pecking order. If any of the tourists cared to look - which they didn't - they would have seen stray feathers drifting down to the pavement.\n\n\"What's going on?\" Stringfoot demanded. He had stood on a lot of statues in his time but he'd never stood on ceremony.\n\nThere was a flurry of wings as a path was cleared to the head of the pigeon secret service, Lord Boggle-Eye, Protector of the Column, Order of the Knobbly Beak.\n\n\"We have received alarming news from the crows,\" he said. He paused to peck at his own shadow. \"Oblong Moose is working on a form of Artificial Wingtelligence with the potential to replace all of us.\"\n\nStringfoot gasped. \"All pigeons?\"\n\n\"All birds.\" Lord Boggle-Eye tipped his head to one side and stared at Stringfoot with a single eye. \"This is a matter we must address with great urgency. I'm sorry this has come so quickly after your excellent work in Germany, but we need you to go to America immediately.\"\n\n\"And take out Oblong Moose?\"\n\n\"I don't give orders like this lightly. Take great care, Doublecoo. This Moose is a dangerous character.\"","choices":[{"text":"To fly to America, go to","target":"871f75de-70a1-489b-8c11-850d24aec516"},{"text":"To take the tube to Heathrow Airport, go to","target":"89d2d227-859c-42a8-9fa5-15d41c4caad3"}]},{"id":"871f75de-70a1-489b-8c11-850d24aec516","text":"Lord Boggle-Eye's instructions were as clear as they were ambitious. Stringfoot's destination was Los Angeles, where his Californian counterparts were orchestrating a trap for Oblong Moose. His specific destination within Los Angeles was 5,443 miles away as the crow flies, and he was merely a pigeon. As determined as he was to go there as directly as his stubby wings could take him, it was simply too far to fly.\n\nHe realised this as he was flying over Slough, and diverted to Southampton. Once there he circled the docks, searching for an Atlantic-bound ship. He would have to slum it on a cargo vessel loaded with an improbable height of shipping containers, but that is no hardship for a pigeon on a mission. The journey would take a few weeks, but surely Lord Boggle-Eye would have accounted for that in his plan. He couldn't be expected to fly to Los Angeles unaided.\n\nThen he saw her. The Queen Mary 2. Fourteen decks of luxury, boarding passengers into an interior so vast that they looked like ants. He resisted an instinct to peck at them, flew down and perched on the rim of its funnel. This would be faster than a cargo ship by a small duration, but more than that he had only just come off the German job. Why not mix a little pleasure with his business?\n\nHis decision made, he flew along the ship and landed amongst the communications and navigation infrastructure. He strutted towards one of the radar domes and pecked at its base three times. From within, there came a response of four taps. In answer to this, he pecked a further two times. A small door opened and he sauntered through, into the base of the radar dome.\n\nInside, a bird-scale spiral staircase took him into the sphere itself, and as he ascended, music swelled and lights began to spin around him. This was the legendary Club Squawk, a notorious international seagull establishment. The music was violently loud gabber techno and was not to Doublecoo Stringfoot's refined tastes. He was more of a happy hardcore pigeon. It was a good place to hole up while crossing the Atlantic. The pigeons had held a maritime détente with the seagulls for as long as he could recall, which frankly wouldn't be very long once he gets stuck into the bilgewater martinis that were the club's speciality.\n\nHe took a stool by the bar and admired the colourful lights that whizzed around the room, attached to the radar dish.\n\n\"Oi, pigeon!\" a drunken voice slurred from the other end of the bar. \"Got any chips?\"\n\nStringfoot sighed. Not wishing to get into a fight on his first day of the voyage, he summoned the barpuffin by nodding and cooing in his direction. \"A bowl of chips for my new friend please barkeep. On my tab.\"\n\nHe waved genially at the seagull drunkard. The seagull glowered at him hungrily but Stringfoot held his nerve. The chips arrived swiftly and he was soon forgotten in the ensuing feeding frenzy.\n\n\"One martini please, barkeep,\" Stringfoot ordered once the situation appeared defused. It was going to be a long trip.","choices":[{"text":"Go to","target":"b18459cc-342d-449b-9c2a-1058647284f4"}]},{"id":"89d2d227-859c-42a8-9fa5-15d41c4caad3","text":"It is a short flight from Trafalgar Square to Picadilly Circus, so before long Stringfoot found himself waiting on the southbound platform of the Picadilly Line. When the train arrived, he hopped on board. Some passengers noticed him to their amusement, but he wasn't particularly concerned. London is a big city and he would be quickly forgotten, just another pigeon in the crowd.\n\nAt Baron's Court, another pigeon boarded.\n\n\"Stringfoot?\" they enquired.\n\nStringfoot scrutinised the newcomer, his head frantically bobbing up and down. \"Do I know you?\"\n\n\"Not if I've been doing my job properly.\"\n\nStringfoot's feathers bristled and he backed away towards the doors. \"You're with Oblong Moose?\"\n\n\"Relax, we're both professionals. I'm not going to start anything here.\" He advanced on Stringfoot with a confident strut. \"I am here to give you a friendly warning. Moose has no quarrel with the pigeons. Now, the geese are another matter. And don't get me started on the ducks.\"\n\nThe train screeched to a halt at Hammersmith. The doors slid open and during the commotion of embarking and disembarking passengers Stringfoot flew over the interloper and pecked at their tail feathers. \"Racist scum,\" he shouted. The interloper turned to look at him in astonishment, as though he really couldn't believe Stringfoot had any reason to quarrel. However that moment of hesitation was all the time Stringfoot needed to fling poo at his head. It splashed across his face, blinding one eye and sending him into a flapping panic. The carriage doors began beeping, warning of their imminent closure, which was the cue for Stringfoot to kick the interloper off the train and onto the platform. The doors closed, the train lurched on, and Stringfoot walked coolly to the central pole.\n\nThe rest of the journey to Heathrow was uneventful. Moose evidently didn't have that much of a presence in the country. At the airport he followed some tourists struggling with huge suitcases into the terminal and lurked near the baggage check area. An integral part of his spy training was memorising the networks of baggage conveyors at major airports. He couldn't sneak on board an ordinary passenger jet as he would be spotted in the cabin and would likely perish in the hold. There were however flights which specialised in transporting animals. All he had to do was sneak on board one of those.\n\nThat does of course make it sound easier than it was. First he had to negotiate the conveyor network, which is a sequence of brutal traps that are punishing enough for luggage, let alone a small bird. There are relentlessly torqued gears and belts, and pneumatic pistons for routing luggage to its destination. It was crucial that he recall his path through exactly.\n\nFortunately it wasn't too far, and he soon found himself sauntering into the spartan interior of his plane. He could hear the chatter of other animals, all crated or caged. His only challenge was to find a quiet corner where he could keep his head down for the duration of the flight.\n\nHe crept past a cat carrier, his beady eyes alert to signs of movement.\n\n\"I can smell a bird,\" said a voice from somewhere in the shadows. It was unmistakeably a dog's voice.\n\nFrom within the cat carrier, eyes opened like headlights. Stringfoot froze. He had to remind himself that the cat was safely behind bars.\n\n\"I do like a bit of bird,\" said the cat. It purred as it approached the front of its carrier.\n\nThe dog growled with amusement. \"Where's your cage, little bird?\"\n\n\"We should tell someone,\" said the cat. \"Can't have wild animals loose on an aeroplane.\"\n\n\"Yeah,\" agreed the dog. \"We should tell someone. Unless?\"\n\nStringfoot cocked his head to one side. \"Unless what?\" He couldn't imagine what he could possibly offer them.\n\n\"Got any sausages?\" asked the dog.\n\nThe cat hissed angrily. \"Not the sausages again! Of course he hasn't got any sausages, he's just a little pigeon.\"\n\n\"Well I can't see him from here, can I? I can only smell him.\"\n\n\"Does he smell like he has any sausages?\"\n\nThe dog sighed heavily. \"No.\"\n\n\"I've got an idea,\" said Stringfoot. He hopped over to the cat carrier and with a flurry of wings was standing on top of it.\n\n\"Hey!\" the cat protested. \"What are you doing up there?\"\n\n\"Do you know where you're going?\" said Stringfoot?\"\n\n\"Duh,\" the cat replied sarcastically. \"The vet, obviously. That's where I always go when they trap me in this thing.\"\n\n\"Interesting,\" said Stringfoot as he read the shipping address sticker on the top of the cat carrier. \"I've got some very exciting news for you.\"","choices":[{"text":"Go to","target":"b18459cc-342d-449b-9c2a-1058647284f4"}]},{"id":"b18459cc-342d-449b-9c2a-1058647284f4","text":"Hidden in the leaves of a tree, Agent Doublecoo Stringfoot watched over the gooey black plain below. He was at La Brea Tar Pits in Los Angeles, where his department's intelligence had suggested he would be able to get a clear shot at Oblong Moose. He had been up in the tree all day, patiently waiting his violent rendezvous. He didn't mind the wait. After the long journey to Los Angeles it was a small thing.\n\nThe wind rose suddenly and the tree began to rock. Stringfoot clung to his branch, startled by the sudden change in the weather, and as the gusts rose in intensity he realised that it was no ordinary wind. He looked around and was amazed to see a large metal bird flapping around over the tar pits.\n\n\"Artificial Wingtelligence!\" he cooed in awe. \"He's much further along than we thought.\"\n\nThe huge mechanical bird landed next to the tar pits and a set of steps unfurled from its breast. A gracelessly rectangular moose disembarked and stood by the bird's feet, peering intensely at the surroundings.\n\nStringfoot stiffened. This was it. He prepared himself to strike swiftly, before Oblong Moose knew he was even there.\n\n\"Wait,\" Oblong Moose called. \"Doublecoo Stringfoot, I know what you're planning. I am not your enemy. Join me and together we can defeat the duck invasion!\"\n\nStringfoot was having none of that sort of rhetoric. In fact he was barely listening to Moose. The job was of paramount importance. He simply had to cleanly strike Moose and clear off before his security can react. If he was really lucky, he considered, he might send Moose stumbling into one of the tar pits. The thought of him disappearing in a viscous bubble was very pleasing.\n\nHe launched himself from the tree. It was curious, he thought, that Moose didn't appear to have any security with him. It was an abstract observation because he was now committed to the strike. As he took aim, Moose looked directly at him and pointed at him.\n\n\"Don't say I didn't warn you,\" said Moose.\n\nA blue beam of light shot out from the metal bird's beak and the next thing Stringfoot knew, he was back in Trafalgar Square.","choices":[{"text":"Go to","target":"5f6eee1b-b89c-4cae-904c-22502a756884"}]},{"id":"5f6eee1b-b89c-4cae-904c-22502a756884","text":"Doublecoo Stringfoot flew up to perch on the head of one of the lions at the base of Nelson's Column. As Trafalgar Square's leading pigeon secret agent, he was enjoying the ebb and flow of afternoon tourists. It was a pleasant change of pace from his last mission, which had involved - what had it involved? He vaguely recalled something about tar but couldn't make much sense of it. Oh yes! He had been taking out a German right-winger. Stringfoot was a master of the noble pigeon martial art of flung-poo, and he had caught his nazi target squarely in the eye. It had been captured by a photographer and liberally splashed around the papers. Stringfoot himself wasn't implicated of course. By the time the camera's shutter had clicked he was long gone, just another pigeon in the drab Berlin sky.\n\nNow was his time to relax, and he was considering helping himself to some discarded pastry flakes when an outbreak of cooing directed his attention towards the top of Nelson's Column. He was being summoned.\n\nThe top of Nelson's head was more chaotically populated than usual, and his arrival there precipitated a great shift in the pecking order. If any of the tourists cared to look - which they didn't - they would have seen stray feathers drifting down to the pavement.\n\n\"What's going on?\" Stringfoot demanded. He had stood on a lot of statues in his time but he'd never stood on ceremony.\n\nThere was a flurry of wings as a path was cleared to the head of the pigeon secret service, Lord Boggle-Eye, Protector of the Column, Order of the Knobbly Beak.\n\n\"We have received alarming news from the crows,\" he said. He paused to peck at his own shadow. \"Ham Porkman is working on a form of Artificial Wingtelligence with the potential to replace all of us.\"\n\nStringfoot gasped. \"All pigeons?\"\n\n\"All birds.\" Lord Boggle-Eye tipped his head to one side and stared at Stringfoot with a single eye. \"This is a matter we must address with great urgency. I'm sorry this has come so quickly after your excellent work in Germany, but we need you to go to America immediately.\"\n\n\"And take out Ham Porkman?\"\n\n\"I don't give orders like this lightly. Take great care, Doublecoo. This Porkman is a dangerous character.\"","choices":[{"text":"To fly to America, go to","target":"a1b1bd08-8b48-4622-97ea-706a34fe8f21"},{"text":"To take the tube to Heathrow Airport, go to","target":"311a3a49-33fc-4a03-9fd1-5ccc3af6dc3b"},{"text":"To refuse to take the mission, go to","target":"065d34ba-15ac-4eff-b868-7a79131de6a7"},{"text":"To buy some sausages, go to","target":"5b70a3d1-12b4-42cd-b451-9e2b63250aa3"}]},{"id":"a1b1bd08-8b48-4622-97ea-706a34fe8f21","text":"Lord Boggle-Eye's instructions were as clear as they were ambitious. Stringfoot's destination was Los Angeles, where his Californian counterparts were orchestrating a trap for Ham Porkman. His specific destination within Los Angeles was 5,443 miles away as the crow flies, and he was merely a pigeon. As determined as he was to go there as directly as his stubby wings could take him, it was simply too far to fly.\n\nHe realised this as he was flying over Slough, and diverted to Southampton. Once there he circled the docks, searching for an Atlantic-bound ship. He would have to slum it on a cargo vessel loaded with an improbable height of shipping containers, but that is no hardship for a pigeon on a mission. The journey would take a few weeks, but surely Lord Boggle-Eye would have accounted for that in his plan. He couldn't be expected to fly to Los Angeles unaided.\n\nThen he saw her. The Queen Mary 2. Fourteen decks of luxury, boarding passengers into an interior so vast that they looked like ants. He resisted an instinct to peck at them, flew down and perched on the rim of its funnel. This would be faster than a cargo ship by a small duration, but more than that he had only just come off the German job. Why not mix a little pleasure with his business?\n\nHis decision made, he flew along the ship and landed amongst the communications and navigation infrastructure. He strutted towards one of the radar domes and pecked at its base three times. From within, there came a response of four taps. In answer to this, he pecked a further two times. A small door opened and he sauntered through, into the base of the radar dome.\n\nInside, a bird-scale spiral staircase took him into the sphere itself, and as he ascended, music swelled and lights began to spin around him. This was the legendary Club Squawk, a notorious international seagull establishment. The music was violently loud gabber techno and was not to Doublecoo Stringfoot's refined tastes. He was more of a happy hardcore pigeon. It was a good place to hole up while crossing the Atlantic. The pigeons had held a maritime détente with the seagulls for as long as he could recall, which frankly wouldn't be very long once he gets stuck into the bilgewater martinis that were the club's speciality.\n\nHe took a stool by the bar and admired the colourful lights that whizzed around the room, attached to the radar dish.\n\n\"Oi, pigeon!\" a drunken voice slurred from the other end of the bar. \"Got any chips?\"\n\nStringfoot sighed. Why did seagulls have to ruffle his feathers like that. \"No I don't have any chips,\" he snapped. \"Now bore off.\"\n\n\"You wot?\" the seagull screeched before lunging at Stringfoot. Its sharp beak narrowly missed and Stringfoot hastily flapped backwards.\n\nThere wasn't enough room in the club to use flung-poo and so Stringfoot feared he had blundered into a fight he couldn't win.\n\n\"I'm going to bite your stubby little head off, pigeon,\" the seagull said. It then attempted to do just that, its huge maw bearing down on the cornered Stringfoot.\n\nHe closed his eyes and waited for the inevitable, but just as the anticipation became truly unbearable the air was pierced by a loud metallic banging. He opened one eye and saw the barpuffin banging two pans together.\n\n\"Free chips for everyone!\" the barpuffin called.\n\nThe seagull froze. It looked thoughtfully at Stringfoot, snapped its beak closed and swung around to await the promised free chips.\n\nStringfoot hauled himself weakly back onto his stool, exhausted by his brush with death. \"Thanks,\" he said to the barpuffin .\n\n\"You're welcome,\" the barpuffin replied. \"I'll charge the chips to your tab.\"","choices":[{"text":"Go to","target":"f04fca07-d4c4-4a49-ac58-ec6661628e26"}]},{"id":"311a3a49-33fc-4a03-9fd1-5ccc3af6dc3b","text":"It is a short flight from Trafalgar Square to Picadilly Circus, so before long Stringfoot found himself waiting on the southbound platform of the Picadilly Line. When the train arrived, he hopped on board. Some passengers noticed him to their amusement, but he wasn't particularly concerned. London is a big city and he would be quickly forgotten, just another pigeon in the crowd.\n\nAt Baron's Court, another pigeon boarded.\n\n\"Stringfoot?\" they enquired.\n\nStringfoot scrutinised the newcomer, his head frantically bobbing up and down. \"Do I know you?\"\n\n\"Yes, we met the last time you did this.\"\n\nStringfoot's feathers bristled and he backed away towards the doors. \"What kind of mind game is this?\"\n\n\"Ah, they did say you wouldn't remember much.\" He advanced on Stringfoot with a confident strut. \"I am here to give you a friendly warning. The Artificial Wingtelligence Kleptocracy has no quarrel with the pigeons.\"\n\n\"The Artificial Wingtelligence Kleptocracy?\" Stringfoot asked.\n\n\"Also known as AWK.\"\n\n\"So Porkman's even stealing bird sounds for his sketchy consortium?\" Stringfoot replied angrily.\n\nThe train screeched to a halt at Hammersmith. The doors slid open and during the commotion of embarking and disembarking passengers Stringfoot flew over the interloper and pecked at their tail feathers. \"I believe this is your stop,\" he shouted. The interloper turned to look at him in astonishment, as though he really couldn't believe Stringfoot had any reason to quarrel. However that moment of hesitation was all the time Stringfoot needed to fling poo at his head. It splashed across his face, blinding one eye and sending him into a flapping panic. The carriage doors began beeping, warning of their imminent closure, which was the cue for Stringfoot to kick the interloper off the train and onto the platform. The doors closed, the train lurched on, and Stringfoot walked coolly to the central pole.\n\nThe rest of the journey to Heathrow was uneventful. Porkman evidently didn't have that much of a presence in the country. At the airport he followed some tourists struggling with huge suitcases into the terminal and lurked near the baggage check area. An integral part of his spy training was memorising the networks of baggage conveyors at major airports. He couldn't sneak on board an ordinary passenger jet as he would be spotted in the cabin and would likely perish in the hold. There were however flights which specialised in transporting animals. All he had to do was sneak on board one of those.\n\nThat does of course make it sound easier than it was. First he had to negotiate the conveyor network, which is a sequence of brutal traps that are punishing enough for luggage, let alone a small bird. There are relentlessly torqued gears and belts, and pneumatic pistons for routing luggage to its destination. It was crucial that he recall his path through exactly.\n\nFortunately it wasn't too far, and he soon found himself sauntering into the spartan interior of his plane. He could hear the chatter of other animals, all crated or caged. His only challenge was to find a quiet corner where he could keep his head down for the duration of the flight.\n\nHe crept past a cat carrier, his beady eyes alert to signs of movement.\n\n\"I can smell a bird,\" said a voice from somewhere in the shadows. It was unmistakeably a dog's voice.\n\nFrom within the cat carrier, eyes opened like headlights. Stringfoot froze. He had to remind himself that the cat was safely behind bars.\n\n\"It's that pigeon,\" said the cat. \"Before you start, he doesn't have any sausages.\"\n\n\"Have we met?\" asked Stringfoot. He was overcome with a sense of deja vu. He supposed it was because of the pigeon he'd dealt with on the tube, but it felt as though some greater forces were also in operation.\n\n\"We're on our way to a new life in America,\" said the cat.\n\n\"And you have no sausages,\" the dog growled. \"So what are you going to do for us?\"\n\nStringfoot looked at the cat curiously. \"Why should I do anything for you?\"\n\nThe dog started barking.\n\n\"You hear that?\" asked the cat. \"If he keeps that up, someone will come to check everything's okay and they will find you and shoo you out of the plane.\"\n\n\"Okay,\" said Stringfoot.\n\n\"What?\" said the dog. \"I mean, woof! Woof! Bark bark bark!\"\n\n\"Time's ticking,\" said the cat.\n\nStringfoot tipped forward and placed his head against the deck. Then, looking satisfied, he faced the cat. \"Time is indeed ticking. You hear that?\"\n\n\"Hear what?\" the cat asked. \"Hey, be quiet!\" he shouted at the dog.\n\nThe dog stopped barking and they could all hear the building pitch of the plane's engines starting.\n\n\"These flights operate on a tight timetable,\" said Stringfoot. \"Nobody's going to come just because a dog is freaking out.\"\n\n\"Nuts,\" said the cat. It sat down and licked a paw. \"Make yourself at home, I guess. I'm Dinky and my lead singer over there is called Topper.\"\n\n\"Pleased to make your acquaintance, you can call me Doublecoo.\" He bowed a little stiffly.","choices":[{"text":"Go to","target":"f04fca07-d4c4-4a49-ac58-ec6661628e26"}]},{"id":"065d34ba-15ac-4eff-b868-7a79131de6a7","text":"Stringfoot hesitated before looking Lord Boggle-Eye decisively in the eye. \"There's something you should know. I've already been on this mission, except it was to take out Oblong Moose. He shot me with some sort of laser that sent me back here.\"\n\nLord Boggle-Eye frowned. \"Oh dear, it seems the pressure is really getting to you. Look old chap, I know you desperately need a break after that German business, but you have to hold it together for a while longer. There isn't anyone else who can do this job, and if Porkman completes his Artificial Wingtelligence project we'll all be knocked off our perches.\"\n\n\"That's just what I'm trying to tell you,\" Stringfoot urged. \"Oblong Moose already had completed his. I was ambushed by him in a giant mechanical bird! That's what sent me back in time, or did something with me, because now I'm having to do it all again, only this time it's not Moose, it's Porkman.\"\n\nLord Boggle-Eye's eyes boggled. Or rather they boggled more than usual. \"Did you say a mechanical bird?\"\n\n\"Yes.\"\n\n\"Well, this is quite rum. The boffins said that exactly what Artificial Wingtelligence looks like, but that information is so classified that nobody else is supposed to know about it. Including you.\"\n\n\"Then you believe me?\" Stringfoot said anxiously.\n\nLord Boggle-Eye nodded slowly. \"Yes. Actually I'm relieved that you're not going gaga. But if what you say is true, what can we do about it?\"\n\n\"I see what you mean,\" Stringfoot agreed. \"I suppose I should expect a metal bird this time too.\"\n\n\"Be very careful, Doublecoo. Take your shot as soon as you possibly can and get out of there.\"\n\n\"Then the mission is still on?\"\n\n\"Even if Porkman has created Artificial Wingtelligence, if we can take him out that buys us some time.\"\n\nStringfoot saluted him. \"I won't let you down again sir.\"\n\nLord Boggle-Eye cooed softly. \"My dear chap, you've never let me down.\"","choices":[{"text":"To fly to America, go to","target":"a1b1bd08-8b48-4622-97ea-706a34fe8f21"},{"text":"To take the tube to Heathrow Airport, go to","target":"311a3a49-33fc-4a03-9fd1-5ccc3af6dc3b"},{"text":"To buy some sausages, go to","target":"5b70a3d1-12b4-42cd-b451-9e2b63250aa3"}]},{"id":"5b70a3d1-12b4-42cd-b451-9e2b63250aa3","text":"Buying anything is always a fraught experience for a pigeon, and in this respect Doublecoo Stringfoot was no different. Humans are reluctant to trade with birds, possibly due to the seagulls giving them all a bad reputation. Stringfoot was however no common thief, so after removing a pack of pork sausages from the shelves of the Tesco Express near Picadilly Circus, he made a point of leaving what he thought was reasonable recompense. He was far too busy to keep up with modern prices, but after careful consideration he had decided that one lost coat button, a used tube ticket and three cigarette butts was about right. He placed them on the shelf and left with the sausages before anyone could question his arithmetic.\n\nThe sausages were quite cumbersome (although not Cumberland) so he decided he would catch the tube to Heathrow. Before long he was waiting on the southbound platform at Picadilly Circus.\n\nWhen the train arrived, he hopped on board. Some passengers noticed him to their amusement, but he wasn't particularly concerned. London is a big city and he would be quickly forgotten, just another pigeon in the crowd. That said, he was surprised that the sausages hadn't invited comment.\n\nAt Baron's Court, another pigeon boarded.\n\n\"Stringfoot?\" they enquired.\n\nStringfoot scrutinised the newcomer, his head frantically bobbing up and down. \"Do I know you?\"\n\n\"Yes, we met the last time you did this.\"\n\nStringfoot's feathers bristled and he backed away towards the doors. \"What kind of mind game is this?\"\n\nThe newcomer looked puzzled. \"Is that a pack of sausages?\"\n\nStringfoot glanced at the pack. He had placed it in the corner by the doors. \"Yes. What of it?\"\n\n\"And you accuse me of playing mind games.\" He bobbed his head. \"Let's get on with it.\" He advanced on Stringfoot with a confident strut. \"I am here to give you a friendly warning. The Artificial Wingtelligence Kleptocracy has no quarrel with the pigeons.\"\n\n\"The Artificial Wingtelligence Kleptocracy?\" Stringfoot asked.\n\n\"Also known as AWK.\"\n\n\"So Porkman's even stealing bird sounds for his sketchy consortium?\" Stringfoot replied angrily.\n\nThe train screeched to a halt at Hammersmith. The doors slid open and during the commotion of embarking and disembarking passengers Stringfoot flew over the interloper and pecked at their tail feathers. \"I believe this is your stop,\" he shouted. The interloper turned to look at him in astonishment, as though he really couldn't believe Stringfoot had any reason to quarrel. However that moment of hesitation was all the time Stringfoot needed to fling poo at his head. It splashed across his face, blinding one eye and sending him into a flapping panic. The carriage doors began beeping, warning of their imminent closure, which was the cue for Stringfoot to kick the interloper off the train and onto the platform. The doors closed, the train lurched on, and Stringfoot walked coolly to the central pole.\n\nThe rest of the journey to Heathrow was uneventful. Porkman evidently didn't have that much of a presence in the country. At the airport he followed some tourists struggling with huge suitcases into the terminal and lurked near the baggage check area. An integral part of his spy training was memorising the networks of baggage conveyors at major airports. He couldn't sneak on board an ordinary passenger jet as he would be spotted in the cabin and would likely perish in the hold. There were however flights which specialised in transporting animals. All he had to do was sneak on board one of those.\n\nThat does of course make it sound easier than it was. First he had to negotiate the conveyor network, which is a sequence of brutal traps that are punishing enough for luggage, let alone a small bird. There are relentlessly torqued gears and belts, and pneumatic pistons for routing luggage to its destination. It was crucial that he recall his path through exactly.\n\nFortunately it wasn't too far, and he soon found himself sauntering into the spartan interior of his plane. He could hear the chatter of other animals, all crated or caged. His only challenge was to find a quiet corner where he could keep his head down for the duration of the flight.\n\nHe crept past a cat carrier, his beady eyes alert to signs of movement.\n\n\"I can smell a bird,\" said a voice from somewhere in the shadows. It was unmistakeably a dog's voice.\n\nFrom within the cat carrier, eyes opened like headlights. Stringfoot froze. He had to remind himself that the cat was safely behind bars.\n\n\"It's that pigeon,\" said the cat. \"And I want you to promise to keep your cool when I tell you the next part.\"\n\n\"Oh boy! Oh boy!\" the dog woofed. \"He's got some sausages hasn't he? I thought I could smell sausages!\"\n\nThe cat gave Stringfoot a pained look. \"He's really excited about the sausages, buddy.\"\n\nStringoot looked around the dingy interior of the plane. \"I suppose I'd better give him them, then.\"\n\n\"Yes yes yes!\" Barked the dog. \"This is the best day of my life!\"\n\n\"Hey,\" the cat hissed at Stringfoot. \"Best not give them to him all at once. It's a long flight and he's got no self-control. I don't want to have to hear him howling about his upset stomach for the rest of the way.\"\n\n\"That's a sensible point,\" said Stringfoot.\n\n\"Yeah, I'm very much the brains of this operation,\" said the cat. \"I'm Dinky and my lead singer over there is called Topper.\"\n\n\"Pleased to make your acquaintance, you can call me Doublecoo.\" He bowed a little stiffly.","choices":[{"text":"Go to","target":"f04fca07-d4c4-4a49-ac58-ec6661628e26"}]},{"id":"f04fca07-d4c4-4a49-ac58-ec6661628e26","text":"Hidden in the leaves of a tree, Agent Doublecoo Stringfoot watched over the gooey black plain below. He was at La Brea Tar Pits in Los Angeles, where his department's intelligence had suggested he would be able to get a clear shot at Ham Porkman. He had been up in the tree all day, patiently waiting his violent rendezvous. He didn't mind the wait. After the long journey to Los Angeles it was a small thing.\n\nThen, finally, he spotted him. He was approaching the tar pits flanked by two security pigs. Their trotters clattered on the path. Ham Porkman looked anxious. Had he been tipped off? The job was of paramount importance. He simply had to cleanly strike Porkman and clear off before his security can react. If he was really lucky, he considered, he might send Porkman stumbling into one of the tar pits. The thought of him disappearing in a viscous bubble was very pleasing.\n\nHe launched himself from the tree. Porkman was still looking around nervously, but neither he nor his security pigs had looked in Stringfoot's direction.\n\nStringfoot took aim and unloaded directly into Porkman's face. It was a perfect shot. For a wingbeat Stringfoot hung suspended in the air, watching Porkman reel squealing from the blow, his security pigs' eyes widening in horror.\n\nA moment was all he could afford, so with a rush of adrenaline he was away, intent on losing himself in the traffic on Wilshire Boulevard. However this plan was cut short when a huge gust of wind blew him sideways and almost forced him to land. He looked to see what had caused it and saw a giant metal bird hovering over Porkman. It's massive wings were beating out a rhythmic wash that pinned Porkman and his staff to the ground.\n\n\"Artificial Wingtelligence,\" Stringfoot cooed.\n\n\"I'd like to thank you,\" a voice boomed from the metal bird. It was unmistakable Oblong Moose. \"You've done me a huge favour by taking out Porkman.\"\n\nStringfoot struggled to stay in the air under the relentless pressure from the metal bird's flapping wings. He watched with a sense of dread as it turned to face him.\n\n\"You know what they say,\" said Moose. \"No good deed goes unpunished.\"\n\nA blue beam of light shot out from the metal bird's beak and the next thing Stringfoot knew, he was back in Trafalgar Square.","choices":[{"text":"Go to","target":"cd0b9878-3d9e-47e8-a004-58fb55783962"}]},{"id":"cd0b9878-3d9e-47e8-a004-58fb55783962","text":"Doublecoo Stringfoot flew up to perch on the head of one of the lions at the base of Nelson's Column. As Trafalgar Square's leading pigeon secret agent, he was enjoying the ebb and flow of afternoon tourists. It was a pleasant change of pace from his last mission, which had involved - what had it involved? It had involved Sam Porkman and Oblong Moose! Something very odd was going on. He knew that he must tell Lord Boggle-Eye about it immediately and launched himself upwards towards the top of Nelson's Column.\n\nUpon arrival he pecked his way through Lord Boggle-Eye's entourage with considerable urgency. Some of them pecked back but most knew better than to interfere with the pecking order.\n\n\"Ah, Stringfoot!\" said Lord Boggle-Eye once Stringfoot had cleared a path. \"What luck, I was just about to summon you.\"\n\n\"Let me guess,\" Stringfoot interrupted, \"Artificial Wingtelligence?\"\n\nLord Boggle-Eye blinked. \"Why yes. How did you know?\"\n\n\"Who do you need taking out this time? Moose or Porkman, or someone else?\"\n\n\"Straight to the point as always, very good.\" He puffed out his breast. \"Bit of a laundry list really. You'll need to have had a hearty breakfast.\"\n\n\"Oblong Moose is behind all of this. He should be my primary target.\"\n\nLord Boggle-Eye looked at Stringfoot disapprovingly. \"Moose is not on the list. Do not attack Oblong Moose. Do you understand?\"\n\nStringfoot frowned. \"Yes, I think I do. Very well then, who are my targets?\"\n\n\"Dairy Amooday, Andrex Carp and Bark Dufflecoat.\"\n\n\"You do realise they are all Oblong Moose's competitors and he would love to have them taken out.\"\n\n\"Nonsense,\" said Lord Boggle-Eye. \"For one thing Ham Porkman isn't on the list.\"\n\nStringfoot made a low coo through gritted beak. There was no point in arguing, he would have to make his own decision when he returned to the tar pits. \"Very good sir,\" he said. \"I'll be off to Los Angeles now then.\"\n\nLord Boggle-Eye stared at him keenly. \"How the devil did you know the mission is in Los Angeles?\"\n\n\"I doubt we have enough time for me to explain.\"\n\n\"Yes, good point.\" He relaxed a little. \"Do take care out there Doublecoo. I know this mission is a lot to ask of you, but I know you're the right pigeon for the job.\"","choices":[{"text":"To fly to America, go to","target":"1b44359e-b073-43f2-a18c-b5a76abb193f"},{"text":"To take the tube to Heathrow Airport, go to","target":"c4118cbb-d85c-4794-babe-3098fbfb0c1c"}]},{"id":"1b44359e-b073-43f2-a18c-b5a76abb193f","text":"Lord Boggle-Eye's instructions were as clear as they were ambitious. Stringfoot's destination was Los Angeles, where he was to take out the leading lights of Artificial Wingtelligence research. His specific destination within Los Angeles was 5,443 miles away as the crow flies, and he was merely a pigeon. As determined as he was to go there as directly as his stubby wings could take him, it was simply too far to fly.\n\nHe realised this as he was flying over Slough, and diverted to Southampton. Once there he circled the docks, searching for an Atlantic-bound ship. He would have to slum it on a cargo vessel loaded with an improbable height of shipping containers, but that is no hardship for a pigeon on a mission. The journey would take a few weeks, but surely Lord Boggle-Eye would have accounted for that in his plan. He couldn't be expected to fly to Los Angeles unaided.\n\nThen he saw her. The Queen Mary 2. Fourteen decks of luxury, boarding passengers into an interior so vast that they looked like ants. He resisted an instinct to peck at them, flew down and perched on the rim of its funnel. This would be faster than a cargo ship by a small duration, but more than that he had only just come off the German job. Or had he? He vaguely recollected an enormous metal bird but thinking about it gave him a headache. He definitely needed to take it easy for a while.\n\nHis decision made, he flew along the ship and landed amongst the communications and navigation infrastructure. He strutted towards one of the radar domes and pecked at its base three times. From within, there came a response of four taps. In answer to this, he pecked a further two times. A small door opened and he sauntered through, into the base of the radar dome.\n\nInside, a bird-scale spiral staircase took him into the sphere itself, and as he ascended, music swelled and lights began to spin around him. This was the legendary Club Squawk, a notorious international seagull establishment. The music was violently loud gabber techno and was not to Doublecoo Stringfoot's refined tastes. He was more of a happy hardcore pigeon. It was a good place to hole up while crossing the Atlantic. The pigeons had held a maritime détente with the seagulls for as long as he could recall, which frankly wouldn't be very long once he gets stuck into the bilgewater martinis that were the club's speciality.\n\nHe stood by the bar and admired the colourful lights that whizzed around the room, attached to the radar dish. Then he noticed a surly seagull at the other end of the bar. He strode towards it urgently, and on arrival pecked it on the wing.\n\n\"What the?\" the seagull slurred. \"Are you suicidal, little pigeon?\"\n\n\"No,\" Stringfoot replied, and pecked the wing again. \"Come on, let's get this over with!\"\n\nThe seagull shrunk away from him. \"What are you playing at you nutter?\"\n\nDoublecoo pecked the seagull again, this time on the side of its head. \"Are you a seagull or a chicken?\"\n\n\"Stop it,\" the seagull protested. \"You're freaking me out you little weirdo!\"\n\nDoublecoo clucked like a chicken.\n\nThe seagull stared at him in panic, then strutted away and down the stairs. \"I've got other places to be anyway. In fact I think I can smell the lovely vinegary aroma of chips wafting in from the deck.\"\n\nOnce he was gone, Doublecoo settled into his bar stool. It felt good to be in charge and he would need that confidence when he got to his destination.","choices":[{"text":"Go to","target":"b1b5b65d-6c28-4f1e-8ccc-043389fc5fde"}]},{"id":"c4118cbb-d85c-4794-babe-3098fbfb0c1c","text":"It is a short flight from Trafalgar Square to Picadilly Circus, so before long Stringfoot found himself waiting on the southbound platform of the Picadilly Line. When the train arrived, he hopped on board. Some passengers noticed him to their amusement, but he wasn't particularly concerned. London is a big city and he would be quickly forgotten, just another pigeon in the crowd.\n\nAt Baron's Court, another pigeon boarded. Stringfoot had been expecting this and interrupted them before they could speak. \"I've been having the most bizarre day,\" he said wearily, \"so I don't really have the patience for whatever this is.\"\n\nThe newcomer hesitated, wrong-footed by Stringfoot's assertion. \"I'm here to give you - \"\n\n\"Yes, yes. A warning. But from whom? Oblong Moose? Porkman? Carp?\"\n\n\"Moose,\" the other pigeon said. \"But I gather you already know everything, so I'll be on my way.\"\n\n\"Jolly good,\" said Stringfoot.\n\nThey then waited in awkward silence until the train reached Hammersmith. The doors sprang open and with the slightest of glances back at Stringfoot, the other pigeon hopped off on to the platform. The doors closed, the train lurched on, and Stringfoot walked coolly to the central pole.\n\nThe rest of the journey to Heathrow was uneventful. At the airport he followed some tourists struggling with huge suitcases into the terminal and lurked near the baggage check area. An integral part of his spy training was memorising the networks of baggage conveyors at major airports. He couldn't sneak on board an ordinary passenger jet as he would be spotted in the cabin and would likely perish in the hold. There were however flights which specialised in transporting animals. All he had to do was sneak on board one of those.\n\nThat does of course make it sound easier than it was. First he had to negotiate the conveyor network, which is a sequence of brutal traps that are punishing enough for luggage, let alone a small bird. There are relentlessly torqued gears and belts, and pneumatic pistons for routing luggage to its destination. It was crucial that he recall his path through exactly.\n\nFortunately it wasn't too far, and he soon found himself sauntering into the spartan interior of his plane. He could hear the chatter of other animals, all crated or caged. His only challenge was to find a quiet corner where he could keep his head down for the duration of the flight.\n\nHe crept past a cat carrier, his beady eyes alert to signs of movement.\n\n\"I can smell a bird,\" said a voice from somewhere in the shadows. It was unmistakeably a dog's voice.\n\nFrom within the cat carrier, eyes opened like headlights. Stringfoot froze. He had to remind himself that the cat was safely behind bars.\n\n\"I do like a bit of bird,\" said the cat. It purred as it approached the front of its carrier.\n\nThe dog growled with amusement. \"Where's your cage, little bird?\"\n\n\"We should tell someone,\" said the cat. \"Can't have wild animals loose on an aeroplane.\"\n\n\"Yeah,\" agreed the dog. \"We should tell someone. Unless?\"\n\nFor the second time that day, Stringfoot felt his patience stretched. \"Before you progress this sorry charade any further, you should know that I am from Trafalgar Square and have a license to spill.\"\n\n\"You're a spy pigeon?\" the cat cackled. \"I think I ate one of your colleagues once.\"\n\n\"Feline fatality is unfortunately a professional hazard,\" Stringfoot replied matter-of-factly.\n\nThe dog laughed a long, growling laugh. \"He hasn't killed anything,\" he said. \"He's got a bell on his collar and once got chased by a mouse.\"\n\n\"You utter cow!\" the cat hissed. \"I told you that in confidence.\"\n\nDoublecoo wondered what he had flown into, but figured that as long as the cat and dog were arguing with each other, he was safe enough.\n\n\"Oh yeah,\" the dog barked, \"another time he managed to catch a grasshopper and he was so surprised that he freaked out and ran smack into a patio door. So funny!\"\n\n\"Shut up!\" the cat yowled. \"Shut your horrid slobbery gob!\"\n\nStringfoot tiptoed away from the cat carrier. \"Nice meeting you,\" he whispered. \"I'm just going to settle in over here while you sort yourselves out.\" He crept into the relative quiet of the shadows.","choices":[{"text":"Go to","target":"b1b5b65d-6c28-4f1e-8ccc-043389fc5fde"}]},{"id":"b1b5b65d-6c28-4f1e-8ccc-043389fc5fde","text":"Hidden in the leaves of a tree, Agent Doublecoo Stringfoot watched over the gooey black plain below. He was at La Brea Tar Pits in Los Angeles, where his department's intelligence had suggested he would be able to take out the leaders of the Artificial Wingtelligence development community. He had been up in the tree all day, patiently waiting his violent rendezvous. He didn't mind the wait. After the long journey to Los Angeles it was a small thing.\n\nHe noticed a hubbub approaching from the visitor centre. It was them. Dairy Amooday, Andrex Carp and Bark Dufflecoat. Respectively they were a cow in a blue business suit, a fish in a tank on wheels and a small puppy wearing a dufflecoat. All were accompanied by their own security goons. None were looking in Stringfoot's direction. In fact they seemed much at ease, laughing and joking amongst themselves.\n\n\"And then I said that every now and then we could kill a bird,\" Andrex Carp laughed, bubbles fizzing energetically through his tank water. \"Man, it was funny. Nobody knew whether I was joking or not.\"\n\n\"I got some people killed once, said Bark Dufflecoat, eager to join in. \"I don't remember where exactly, or why, but they definitely died.\"\n\n\"Er, cool story,\" said Carp. \"Shall we get to the point.\"\n\n\"Yes,\" said Amooday. \" We're here to decide what to do about Moose, not swap murder stories. Although you can be sure that the version of Artificial Wingtelligence that I'm developing is also really dangerous and might kill us all.\"\n\n\"Nice,\" said Carp.\n\nStringfoot considered what he'd heard carefully. He already suspects that his mission is a trap, but the news that the others are aligning themselves against Moose opened up new possibilities. Instead of taking them out or waiting for Moose to show up, could he form an alliance with them to collectively take out Moose? He found them morally reprehensible but it would be a strategic move to get Moose out of the way. He could worry about the others afterwards.","choices":[{"text":"To collude with the Artificial Wingtelligencia, go to","target":"cb66daaa-c1ea-4cd3-a185-1e97ae49f602"},{"text":"To take out the Artificial Wingtelligencia, go to","target":"e0490539-4788-47e6-9a40-f9f72d781fd9"}]},{"id":"cb66daaa-c1ea-4cd3-a185-1e97ae49f602","text":"Stringfoot dropped out of the tree in as non-threatening manner as he could manage. The assorted security guards all reached into their holsters.\n\n\"Wait!\" Stringfoot insisted. \"I'm here to talk, nothing more.\"\n\n\"Kill the bird,\" said Carp. \"No hard feelings, but I'm too busy to talk.\"\n\n\"No,\" said Dairy Amooday. He gently nudged Carp's security goon aside. \"I'd like to hear what he has to say.\"\n\n\"Fine,\" Carp carped. \"But somebody's getting killed before the end of the day, so help me God.\"\n\n\"I could start a revolution somewhere for you if you like,\" Bark Dufflecoat ventured helpfully.\n\nStringfoot cleared his throat, feeling that the agenda was getting away from him. \"I'm here to talk about Oblong Moose,\" he said.\n\nCarp blew some bubbles in the water thoughtfully. \"Could have him killed, I guess.\"\n\n\"I can take him out,\" Stringfoot said. \"With your help.\"\n\n\"Go on,\" said Carp.\n\n\"He's way ahead of you in developing Artificial Wingtelligence as you will see when he shows up shortly.\"\n\n\"What makes you so sure he'll be here?\"\n\n\"He's expecting me to take you out. Then I assume he will be coming to take me out too. It's a neat and tidy ending for him. I need you to distract him.\"\n\nCarp blew more bubbles as he considered this. \"Why should we trust you? More than that why should you trust us?\"\n\n\"It's a means to an end,\" Stringfoot replied coldly. \"Nothing more, nothing less.\"\n\n\"Now you're talking my language.\" Carp forced his fish lips into a cruel smile. \"Deal.\"\n\n\"Hight fives!\" Bark enthused, offering a raised paw to the others. They ignored his invitation and he lowered the paw awkwardly.\n\nStringfoot returned to his tree while they all waited for Moose to arrive. Moose must have realised quickly that Stringfoot wasn't following his orders because they didn't have to wait for long. His arrival in his giant metal Artificial Wingtelligence bird was impressive, and even the cocksure Andex Carp cowered from its powerful wingbeats.\n\n\"Magnificent!\" Carp enthused. \"I don't know whether to kill Moose or place a huge order with him!\"\n\nBark Dufflecoat began running in circles, snapping at the flapping machinery. \"Come on gang,\" he shouted, \"we're supposed to be distracting him!\"\n\n\"Be careful,\" Dairy Amooday warned, \"we need to draw Moose out the bird, not antagonise him. You're only going make yourself a target doing this.\" He exchanged a look with Carp, then shrugged. \"The again why not? Go for it.\"\n\nEncouraged, Bark Dufflecoat redoubled his effort. The giant metal bird swung to face him, then a piercingly bright blue beam shot forth from its beak at him. Everyone shielded their eyes, and once they could see clearly again, Bark was gone.\n\n\"So far, so good,\" said Carp.\n\nThe metal bird landed and a set of steps unfurled from its breast. Stringfoot launched himself from the tree, determined to get his shot in before Moose had chance to spot him. He prepared himself, and took aim at the top of the stairs, ready to unload as soon as he saw Moose.\n\nDoubt crept into Stringfoot's mind as he got ever closer without any sign of Moose emerging. He was about to peel off and go for a second pass when another blue beam erupted from the giant bird's metal beak, sending him once again back to Trafalfgar Square.","choices":[{"text":"Go to","target":"1c53e388-1d51-462e-8985-b1ea5c91bd7b"}]},{"id":"e0490539-4788-47e6-9a40-f9f72d781fd9","text":"Stringfoot launched himself from the tree, his strafing pass pre-calculated to minimise its duration and let him escape before the security team can react. It was tight work. Bark Dufflecoat was his first target. He was the most nimble so it was crucial to get him out of the way. Fortunately although he was fast, he was also predictable. Stringfoot dispatched him quickly, a shot splashing messily across his face and sending him tumbling, paws scrabbling at the air in disbelief.\n\nThe next target was Amooday. Being literally the size of a cow, he needed taking out while there was still enough payload. He was a slow, lumbering beast however. A single strike to his left eye had him low in despair as he sunk to his knees.\n\nAround this moment the security detail was beginning respond, reaching into their jackets for concealed firearms. Stringfoot ignored them. He was difficult to hit with a pistol, and his work was almost done. There was just Andrex Carp to go, but he was the easiest of shots. Stringfoot only had to let fly into Carp's fish tank. The poo would disperse through the water until Carp was swimming in it. He let slip. His aim was true and his noxious emission splashed into the tank water.\n\nThere was a loud crack and a bullet whistled past Stringfoot's head. It was time to get out of there. He barrelled to his left and was immediately buffeted by a powerful gust of wind. He twisted his head around and was unsurprised to see Moose's giant Artificial Wingtelligence bird bearing down on him. There was a second gunshot, and a third, but Stringfoot could tell from his experience in the field that they were firing on the metal bird, not him. He pushed himself harder, determined to use the covering gunfire to escape. He daren't look back, worrying that doing so could make all the difference between triumph and failure.\n\nIn the end, he didn't have to look back, because he was enveloped in a brilliant blue beam, and the next thing he knew, he was back in Trafalgar Square.","choices":[{"text":"Go to","target":"1c53e388-1d51-462e-8985-b1ea5c91bd7b"}]},{"id":"1c53e388-1d51-462e-8985-b1ea5c91bd7b","text":"Doublecoo Stringfoot flew up to perch on the head of one of the lions at the base of Nelson's Column. As Trafalgar Square's leading pigeon secret agent, he was enjoying the ebb and flow of afternoon tourists. He kept an eye out for poorly supervised dogs and children, keeping the peace at the heart of the Pigeon Empire. It was a pleasant change of pace from his last mission, which he suddenly found himself struggling to remember. Was it something to do with Oblong Moose and a gigantic robot bird? That didn't make much sense. Even if that happened, what was he doing back in Trafalgar Square? No, that was all wrong. He remembered the journey home from Germany. Yes, that was it. He'd been in Germany to take out a fascist. Good, solid work that made complete sense. Stringfoot was a master of the noble pigeon martial art of flung-poo, and he had caught his nazi target squarely in the eye. It had been captured by a photographer and liberally splashed around the papers. Stringfoot himself wasn't implicated of course. By the time the camera's shutter had clicked he was long gone, just another pigeon in the drab Berlin sky.\n\nNow was his time to relax, and he was considering helping himself to some discarded pastry flakes when an outbreak of cooing directed his attention towards the top of Nelson's Column. He was being summoned.\n\nThe top of Nelson's head was more chaotically populated than usual, and his arrival there precipitated a great shift in the pecking order. If any of the tourists cared to look - which they didn't - they would have seen stray feathers drifting down to the pavement.\n\n\"What's going on?\" Stringfoot demanded. He had stood on a lot of statues in his time but he'd never stood on ceremony.\n\nThere was a flurry of wings as a path was cleared to the head of the pigeon secret service, Lord Boggle-Eye, Protector of the Column, Order of the Knobbly Beak.\n\n\"We have received alarming news from the crows,\" he said. He paused to peck at his own shadow. \"Oblong Moose is working on a form of Artificial Wingtelligence with the potential to replace all of us.\"\n\nStringfoot gasped. \"All pigeons?\"\n\n\"All birds.\" Lord Boggle-Eye tipped his head to one side and stared at Stringfoot with a single eye. \"This is a matter we must address with great urgency. I'm sorry this has come so quickly after your excellent work in Germany, but we need you to go to America immediately.\"\n\n\"And take out Oblong Moose?\" Stringfoot felt the odd sensation of deja-vu.\n\n\"I don't give orders like this lightly. Take great care, Doublecoo. This Moose is a dangerous character.\"","choices":[{"text":"To fly to America, go to","target":"871f75de-70a1-489b-8c11-850d24aec516"},{"text":"To take the tube to Heathrow Airport, go to","target":"89d2d227-859c-42a8-9fa5-15d41c4caad3"}]}]}</script>
  <script>
    (() => {
      const passage = document.getElementById('passage');
      const choices = document.getElementById('choices');
      const backButton = document.getElementById('back');
      const restartButton = document.getElementById('restart');
      const error = document.getElementById('error');
      let story;
      let sections;
      let navigationStack = [];
      let current;

      function showSection(id, remember = true) {
        const section = sections.get(String(id));
        if (!section) return showError(`Section ${id} does not exist in the story data.`);
        if (remember && current) navigationStack.push(current);
        current = section.id;
        error.hidden = true;
        passage.replaceChildren();
        section.text.split(/\n\s*\n/).filter(Boolean).forEach(block => {
          const p = document.createElement('p');
          p.textContent = block.replace(/\n/g, ' ');
          passage.append(p);
        });
        choices.replaceChildren();
        section.choices.forEach(choice => {
          const link = document.createElement('a');
          link.className = 'choice';
          link.href = `#${encodeURIComponent(choice.target)}`;
          link.textContent = `${choice.text} [${choice.target}]`;
          link.addEventListener('click', event => {
            event.preventDefault();
            if (location.hash !== link.hash) location.hash = encodeURIComponent(choice.target);
            showSection(choice.target, true);
          });
          choices.append(link);
        });
        backButton.disabled = navigationStack.length === 0;
        document.title = story.title;
      }

      function showError(message) {
        error.textContent = message;
        error.hidden = false;
      }

      function loadStory(data) {
          story = data;
          sections = new Map(data.sections.map(section => [String(section.id), section]));
          const requested = decodeURIComponent(location.hash.slice(1));
          showSection(sections.has(requested) ? requested : data.start, false);
          if (!location.hash) location.hash = encodeURIComponent(data.start);
      }

      const embeddedStory = JSON.parse(document.getElementById('story-data').textContent);
      if (location.protocol === 'file:') {
        loadStory(embeddedStory);
      } else {
        fetch('./tarpit.json')
          .then(response => { if (!response.ok) throw new Error(`Could not load tarpit.json (${response.status}).`); return response.json(); })
          .then(loadStory)
          .catch(() => loadStory(embeddedStory));
      }

      backButton.addEventListener('click', () => {
        if (!navigationStack.length) return;
        const previous = navigationStack.pop();
        location.hash = encodeURIComponent(previous);
        showSection(previous, false);
      });
      restartButton.addEventListener('click', () => {
        navigationStack = [];
        if (sections) {
          location.hash = encodeURIComponent(story.start);
          showSection(story.start, false);
        }
      });
      window.addEventListener('popstate', () => {
        if (!sections) return;
        const id = decodeURIComponent(location.hash.slice(1)) || story.start;
        navigationStack = [];
        showSection(sections.has(id) ? id : story.start, false);
      });
      window.addEventListener('hashchange', () => {
        if (!sections) return;
        const id = decodeURIComponent(location.hash.slice(1)) || story.start;
        showSection(sections.has(id) ? id : story.start, false);
      });
    })();
  </script>
